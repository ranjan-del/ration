[project]
name = "ration"
version = "0.0.0"
description = "A policy kernel that decides how much context, memory, model and reasoning an AI task actually needs."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ranjan G" }]
keywords = ["llm", "context", "inference", "efficiency", "evaluation", "runtime"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ranjan-del/ration"
Repository = "https://github.com/ranjan-del/ration"
Issues = "https://github.com/ranjan-del/ration/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
